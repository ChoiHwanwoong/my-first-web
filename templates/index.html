<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Woongstagram</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .story-ring { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .story-viewed { background: #cbd5e1 !important; }
        @keyframes progress { from { width: 0%; } to { width: 100%; } }
        .animate-progress { animation: progress 5s linear forwards; }
    </style>
</head>
<body class="bg-white text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-white">

    <!-- Header Navigation -->
    <header class="border-b border-slate-200 bg-white sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
            <div onclick="location.reload()" class="text-2xl font-black tracking-tight italic cursor-pointer font-serif text-slate-900 select-none">
                Woongstagram
            </div>

            <div class="flex items-center gap-5 text-xl text-slate-800">
                <i onclick="location.reload()" class="fa-solid fa-house cursor-pointer hover:text-slate-500 transition" title="홈"></i>
                <i onclick="openCreatePostModal()" class="fa-square-plus fa-regular cursor-pointer hover:text-slate-500 transition" title="새 게시물 만들기"></i>
                <a href="/profile" id="headerProfileBtn" class="hidden hover:text-slate-500 transition" title="프로필">
                    <i class="fa-regular fa-user"></i>
                </a>
                <a href="https://github.com/ChoiHwanwoong/my-first-web" target="_blank" class="text-xs bg-slate-100 hover:bg-slate-200 border border-slate-200 px-2.5 py-1 rounded font-mono transition text-slate-700">
                    Git
                </a>
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <main class="max-w-4xl mx-auto px-4 py-6 w-full flex-1 grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <!-- Feed Column (2 Cols) -->
        <section class="md:col-span-2 space-y-6">
            
            <!-- Story Bar -->
            <div class="bg-white border border-slate-200 rounded-xl p-4 flex items-center gap-4 overflow-x-auto scrollbar-hide shadow-sm select-none">
                <div onclick="openCreateStoryModal()" class="flex flex-col items-center gap-1 min-w-[64px] cursor-pointer group shrink-0">
                    <div class="w-14 h-14 rounded-full bg-slate-100 border-2 border-dashed border-slate-300 flex items-center justify-center text-slate-500 group-hover:border-blue-500 group-hover:text-blue-500 transition">
                        <i class="fa-solid fa-plus text-lg"></i>
                    </div>
                    <span class="text-[11px] font-semibold text-slate-600 truncate w-14 text-center">내 스토리</span>
                </div>

                <div id="storiesContainer" class="flex items-center gap-4"></div>
            </div>

            <!-- Feed Posts -->
            <div id="postFeedContainer" class="space-y-6"></div>
        </section>

        <!-- Sidebar Column -->
        <aside class="hidden md:block space-y-6">
            <div id="profileCard" class="bg-white p-4 border border-slate-200 rounded-xl shadow-sm"></div>
            
            <!-- 추천 카드 -->
            <div class="bg-white p-4 border border-slate-200 rounded-xl shadow-sm">
                <div class="flex items-center justify-between text-xs font-bold text-slate-900 mb-3">
                    <span>회원님을 위한 맞춤 추천</span>
                    <i class="fa-solid fa-sparkles text-amber-500"></i>
                </div>
                <div id="recommendationList" class="space-y-3 text-xs"></div>
            </div>

            <footer class="text-[11px] text-slate-400 leading-relaxed font-sans px-1">
                소개 • 도움말 • 개인정보처리방침 • 약관
                <p class="mt-3 text-slate-500">© 2026 WOONGSTAGRAM WEB APP</p>
            </footer>
        </aside>

    </main>

    <!-- 1. 로그인 / 회원가입 모달 -->
    <div id="authModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl relative">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <div class="text-center mb-6">
                <h2 class="text-3xl font-black font-serif italic mb-1 tracking-tight">Woongstagram</h2>
                <p class="text-xs text-slate-500" id="authModalSubtitle">Woongstagram에 로그인하세요.</p>
            </div>

            <div id="loginFormArea" class="space-y-2.5 text-xs">
                <input type="text" id="loginUsername" placeholder="사용자 이름 (아이디)" class="w-full px-3 py-2.5 border border-slate-200 rounded-lg outline-none focus:border-slate-400 bg-slate-50">
                <div class="relative">
                    <input type="password" id="loginPassword" placeholder="비밀번호" class="w-full px-3 py-2.5 border border-slate-200 rounded-lg outline-none focus:border-slate-400 bg-slate-50">
                    <i onclick="togglePasswordVisibility('loginPassword', this)" class="fa-regular fa-eye absolute right-3 top-3 text-slate-400 cursor-pointer"></i>
                </div>
                <button onclick="handleLoginSubmit()" class="w-full py-2.5 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg transition shadow-sm mt-2">로그인</button>
            </div>

            <div id="signupFormArea" class="space-y-2.5 text-xs hidden">
                <input type="text" id="signupUsername" placeholder="사용자 이름 (아이디)" class="w-full px-3 py-2.5 border border-slate-200 rounded-lg outline-none focus:border-slate-400 bg-slate-50">
                <input type="text" id="signupName" placeholder="성명 (프로필 이름)" class="w-full px-3 py-2.5 border border-slate-200 rounded-lg outline-none focus:border-slate-400 bg-slate-50">
                <input type="email" id="signupEmail" placeholder="이메일 주소" class="w-full px-3 py-2.5 border border-slate-200 rounded-lg outline-none focus:border-slate-400 bg-slate-50">
                <div class="relative">
                    <input type="password" id="signupPassword" placeholder="비밀번호" class="w-full px-3 py-2.5 border border-slate-200 rounded-lg outline-none focus:border-slate-400 bg-slate-50">
                    <i onclick="togglePasswordVisibility('signupPassword', this)" class="fa-regular fa-eye absolute right-3 top-3 text-slate-400 cursor-pointer"></i>
                </div>
                <button onclick="handleSignupSubmit()" class="w-full py-2.5 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg transition shadow-sm mt-2">가입하기</button>
            </div>

            <div class="mt-5 pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
                <span id="authToggleText">계정이 없으신가요?</span>
                <button onclick="toggleAuthMode()" id="authToggleBtn" class="text-blue-500 font-bold ml-1 hover:underline">가입하기</button>
            </div>
        </div>
    </div>

    <!-- 2. 게시물 작성 모달 -->
    <div id="createPostModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl relative">
            <button onclick="closeCreatePostModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <h3 class="text-sm font-bold text-center border-b border-slate-100 pb-3 mb-4">새 게시물 만들기</h3>

            <div class="space-y-3 text-xs">
                <input type="text" id="postTitleInput" placeholder="제목" class="w-full px-3 py-2 border border-slate-200 rounded-lg outline-none focus:border-slate-400">
                
                <div class="border border-slate-200 rounded-lg p-2.5 bg-slate-50 flex items-center justify-between">
                    <input type="file" id="postFileInput" accept="image/*" class="text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-600 hover:file:bg-blue-100">
                </div>

                <textarea id="postContentInput" rows="3" placeholder="문구 입력..." class="w-full px-3 py-2 border border-slate-200 rounded-lg outline-none focus:border-slate-400 resize-none"></textarea>
                
                <button onclick="submitNewPost()" class="w-full py-2.5 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg transition">공유하기</button>
            </div>
        </div>
    </div>

    <!-- 3. 스토리 작성 모달 -->
    <div id="createStoryModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl relative">
            <button onclick="closeCreateStoryModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <h3 class="text-sm font-bold text-center border-b border-slate-100 pb-3 mb-4">내 스토리 올리기 (24시간 유지)</h3>

            <div class="space-y-3 text-xs">
                <input type="text" id="storyTitleInput" placeholder="스토리 제목" class="w-full px-3 py-2 border border-slate-200 rounded-lg outline-none focus:border-slate-400">
                
                <div class="border border-slate-200 rounded-lg p-2.5 bg-slate-50 flex items-center justify-between">
                    <input type="file" id="storyFileInput" accept="image/*" class="text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-pink-50 file:text-pink-600 hover:file:bg-pink-100">
                </div>

                <input type="text" id="storyDescInput" placeholder="스토리 문구 (선택)" class="w-full px-3 py-2 border border-slate-200 rounded-lg outline-none focus:border-slate-400">
                
                <button onclick="submitNewStory()" class="w-full py-2.5 bg-pink-500 hover:bg-pink-600 text-white font-bold rounded-lg transition">스토리 올리기</button>
            </div>
        </div>
    </div>

    <!-- 4. 스토리 뷰어 모달 -->
    <div id="storyModal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center">
        <button onclick="closeStoryModal()" class="absolute top-5 right-5 text-white text-2xl hover:text-slate-400 z-50">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="w-full max-w-sm h-[580px] bg-slate-900 rounded-2xl overflow-hidden relative flex flex-col justify-between shadow-2xl border border-slate-800">
            <div class="p-4 z-10 bg-gradient-to-b from-black/80 to-transparent">
                <div class="w-full bg-white/30 h-1 rounded-full mb-3 overflow-hidden">
                    <div id="storyProgress" class="bg-white h-full w-0"></div>
                </div>
                <div class="flex items-center justify-between text-white text-xs">
                    <div class="flex items-center gap-2">
                        <div class="w-7 h-7 rounded-full bg-pink-500 flex items-center justify-center font-bold text-[10px]">S</div>
                        <span id="storyUser" class="font-semibold cursor-pointer hover:underline">username</span>
                        <span id="storyTimeAgo" class="text-white/60 text-[10px]">방금 전</span>
                    </div>
                </div>
            </div>

            <div id="storyBg" class="absolute inset-0 flex flex-col items-center justify-center text-white p-8 text-center bg-cover bg-center">
                <h3 id="storyTitle" class="text-2xl font-bold tracking-tight mb-2 drop-shadow-md">Story Title</h3>
                <p id="storyDesc" class="text-xs text-white/90 leading-relaxed max-w-xs drop-shadow-md">Story Description Content</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        let currentUser = null;
        let isSignupView = false;
        let storyTimer = null;

        document.addEventListener("DOMContentLoaded", () => {
            checkLoginStatus();
            loadStories();
            loadPosts();
            loadRecommendations();
        });

        function timeAgo(dateString) {
            if (!dateString) return '방금 전';
            const formattedDate = dateString.replace(' ', 'T');
            const past = new Date(formattedDate);
            const now = new Date();

            if (isNaN(past.getTime())) return '방금 전';

            const diffInSeconds = Math.floor((now - past) / 1000);

            if (diffInSeconds < 60) return '방금 전';
            const diffInMinutes = Math.floor(diffInSeconds / 60);
            if (diffInMinutes < 60) return `${diffInMinutes}분 전`;
            const diffInHours = Math.floor(diffInMinutes / 60);
            if (diffInHours < 24) return `${diffInHours}시간 전`;
            const diffInDays = Math.floor(diffInHours / 24);
            if (diffInDays < 7) return `${diffInDays}일 전`;
            
            return `${past.getFullYear()}년 ${past.getMonth() + 1}월 ${past.getDate()}일`;
        }

        function checkLoginStatus() {
            fetch('/api/me')
                .then(res => res.json())
                .then(data => {
                    const card = document.getElementById('profileCard');
                    const headerBtn = document.getElementById('headerProfileBtn');

                    if (data.logged_in) {
                        currentUser = data.username;
                        headerBtn.classList.remove('hidden');
                        card.innerHTML = `
                            <div class="flex items-center justify-between text-xs">
                                <div class="flex items-center gap-3">
                                    <a href="/profile/${currentUser}" class="w-10 h-10 rounded-full bg-slate-900 text-white flex items-center justify-center font-bold text-xs uppercase shadow-sm">
                                        ${currentUser.substring(0, 2)}
                                    </a>
                                    <div class="flex flex-col">
                                        <a href="/profile/${currentUser}" class="font-bold text-slate-900 hover:underline">${escapeHtml(data.name)}</a>
                                        <span class="text-slate-400 text-[11px]">@${escapeHtml(currentUser)}</span>
                                    </div>
                                </div>
                                <a href="/profile/${currentUser}" class="text-blue-500 font-semibold text-[11px] hover:underline">프로필</a>
                            </div>
                        `;
                    } else {
                        currentUser = null;
                        headerBtn.classList.add('hidden');
                        card.innerHTML = `
                            <p class="text-xs text-slate-500 mb-3 leading-relaxed">로그인하여 Woongstagram의 사진을 공유하고 소통해 보세요.</p>
                            <button onclick="openAuthModal()" class="w-full py-2 bg-blue-500 hover:bg-blue-600 text-white text-xs font-bold rounded-lg transition shadow-sm">
                                로그인 / 회원가입
                            </button>
                        `;
                    }
                });
        }

        function loadRecommendations() {
            fetch('/api/recommendations')
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('recommendationList');
                    list.innerHTML = '';
                    if (data.status === 'success') {
                        data.recommendations.forEach(r => {
                            const item = document.createElement('div');
                            item.className = "flex items-center justify-between";
                            item.innerHTML = `
                                <div class="flex items-center gap-2.5">
                                    <a href="/profile/${r.username}" class="w-8 h-8 rounded-full bg-slate-100 border border-slate-200 flex items-center justify-center text-[10px] font-bold text-slate-700 uppercase hover:bg-slate-200 transition">
                                        ${r.username.substring(0, 2)}
                                    </a>
                                    <div class="flex flex-col">
                                        <a href="/profile/${r.username}" class="font-semibold text-slate-800 hover:underline">${escapeHtml(r.username)}</a>
                                        <span class="text-[10px] text-slate-400">${escapeHtml(r.reason)}</span>
                                    </div>
                                </div>
                                <button onclick="followUser('${r.username}', this)" class="text-blue-500 font-semibold text-[11px] hover:text-blue-700">팔로우</button>
                            `;
                            list.appendChild(item);
                        });
                    }
                });
        }

        function followUser(targetUsername, btn) {
            if (!currentUser) { alert('로그인이 필요합니다.'); openAuthModal(); return; }
            fetch(`/api/follow/${targetUsername}`, { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        if (data.is_following) {
                            btn.innerText = '팔로잉';
                            btn.className = "text-slate-500 font-semibold text-[11px]";
                        } else {
                            btn.innerText = '팔로우';
                            btn.className = "text-blue-500 font-semibold text-[11px] hover:text-blue-700";
                        }
                    } else { alert(data.message); }
                });
        }

        function loadStories() {
            fetch('/api/stories')
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('storiesContainer');
                    container.innerHTML = '';
                    if (data.status === 'success') {
                        data.stories.forEach(s => {
                            const item = document.createElement('div');
                            item.className = "flex flex-col items-center gap-1 min-w-[64px] cursor-pointer group shrink-0";
                            item.onclick = () => showStoryModal(item, s.id, s.username, s.title, s.desc, s.image_url, s.created_at);
                            
                            const ringClass = s.is_viewed ? 'story-viewed' : 'story-ring';
                            item.innerHTML = `
                                <div class="w-14 h-14 rounded-full p-[2px] ${ringClass} transition group-hover:scale-105">
                                    <div class="w-full h-full rounded-full bg-slate-900 flex items-center justify-center font-bold text-xs text-white border-2 border-white uppercase overflow-hidden">
                                        ${s.image_url ? `<img src="${s.image_url}" class="w-full h-full object-cover">` : s.username.substring(0, 2)}
                                    </div>
                                </div>
                                <span class="text-[11px] text-slate-600 truncate w-14 text-center">${escapeHtml(s.username)}</span>
                            `;
                            container.appendChild(item);
                        });
                    }
                });
        }

        function loadPosts() {
            fetch('/api/posts')
                .then(res => res.json())
                .then(data => {
                    const feed = document.getElementById('postFeedContainer');
                    feed.innerHTML = '';

                    if (data.posts.length === 0) {
                        feed.innerHTML = `<div class="text-center py-12 text-xs text-slate-400">아직 등록된 사진이 없습니다. 첫 포스트를 공유해 보세요!</div>`;
                        return;
                    }

                    data.posts.forEach(post => {
                        const article = document.createElement('article');
                        article.className = "border border-slate-200 rounded-xl bg-white overflow-hidden shadow-sm";
                        
                        const imageHtml = post.image_url ? 
                            `<img src="${escapeHtml(post.image_url)}" alt="Post Image" class="w-full max-h-[450px] object-cover border-y border-slate-100">` :
                            `<div class="bg-slate-50 p-8 text-center flex flex-col items-center justify-center border-y border-slate-100 min-h-[180px]">
                                <h3 class="text-base font-bold text-slate-800 mb-1">${escapeHtml(post.title)}</h3>
                            </div>`;

                        article.innerHTML = `
                            <div class="p-3 flex items-center justify-between border-b border-slate-100">
                                <div class="flex items-center gap-2.5">
                                    <a href="/profile/${post.username}" class="w-8 h-8 rounded-full bg-slate-900 flex items-center justify-center text-[10px] font-bold text-white uppercase hover:opacity-80 transition">
                                        ${post.username.substring(0, 2)}
                                    </a>
                                    <a href="/profile/${post.username}" class="text-xs font-semibold text-slate-900 hover:underline">
                                        ${escapeHtml(post.username)}
                                    </a>
                                    <span class="text-[11px] text-slate-400">• ${timeAgo(post.created_at)}</span>
                                </div>
                            </div>

                            ${imageHtml}

                            <div class="p-3 text-xs">
                                <div class="flex items-center gap-4 text-xl mb-2.5 text-slate-800">
                                    <i onclick="toggleLike(${post.id})" id="likeIcon-${post.id}" class="${post.is_liked ? 'fa-solid fa-heart text-red-500 scale-110' : 'fa-regular fa-heart'} cursor-pointer hover:text-slate-400 transition"></i>
                                    <i onclick="focusComment(${post.id})" class="fa-regular fa-comment cursor-pointer hover:text-slate-400 transition"></i>
                                </div>

                                <p class="font-semibold mb-1 text-slate-900" id="likeCount-${post.id}">좋아요 ${post.likes}개</p>
                                <p class="text-slate-700 leading-relaxed mb-3">
                                    <a href="/profile/${post.username}" class="font-semibold text-slate-900 mr-1.5 hover:underline">${escapeHtml(post.username)}</a>
                                    ${escapeHtml(post.content)}
                                </p>

                                <div id="commentList-${post.id}" class="space-y-1 text-[11px] mb-3"></div>

                                <div class="pt-2 border-t border-slate-100 flex items-center justify-between">
                                    <input type="text" id="commentInput-${post.id}" placeholder="${currentUser ? '댓글 달기...' : '로그인 후 댓글 작성이 가능합니다'}" ${currentUser ? '' : 'disabled'} onkeypress="if(event.key==='Enter') addComment(${post.id})" class="w-full text-xs outline-none bg-transparent text-slate-800 placeholder-slate-400">
                                    <button onclick="addComment(${post.id})" class="text-blue-500 font-semibold text-xs ml-2 hover:text-blue-700 whitespace-nowrap">게시</button>
                                </div>
                            </div>
                        `;
                        feed.appendChild(article);
                        loadComments(post.id);
                    });
                });
        }

        function toggleLike(postId) {
            if (!currentUser) { alert('로그인이 필요합니다.'); openAuthModal(); return; }
            fetch(`/api/posts/${postId}/like`, { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        const icon = document.getElementById(`likeIcon-${postId}`);
                        const count = document.getElementById(`likeCount-${postId}`);
                        if (data.is_liked) {
                            icon.className = "fa-solid fa-heart text-red-500 cursor-pointer transition scale-125";
                            setTimeout(() => icon.classList.remove('scale-125'), 150);
                        } else {
                            icon.className = "fa-regular fa-heart cursor-pointer hover:text-slate-400 transition";
                        }
                        count.innerText = `좋아요 ${data.likes}개`;
                        loadRecommendations();
                    }
                });
        }

        function loadComments(postId) {
            fetch(`/api/comments/${postId}`)
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById(`commentList-${postId}`);
                    list.innerHTML = '';
                    data.comments.forEach(c => {
                        const item = document.createElement('div');
                        item.className = "flex items-center justify-between group py-0.5";
                        item.innerHTML = `
                            <p>
                                <a href="/profile/${c.username}" class="font-semibold text-slate-800 hover:underline">${escapeHtml(c.username)}</a> 
                                ${escapeHtml(c.content)} 
                                <span class="text-[10px] text-slate-400 ml-1.5">${timeAgo(c.created_at)}</span>
                            </p>
                            ${currentUser === c.username ? `
                                <button onclick="deleteComment(${c.id}, ${postId})" class="text-slate-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition px-1">
                                    <i class="fa-solid fa-xmark text-xs"></i>
                                </button>
                            ` : ''}
                        `;
                        list.appendChild(item);
                    });
                });
        }

        function addComment(postId) {
            if (!currentUser) { openAuthModal(); return; }
            const input = document.getElementById(`commentInput-${postId}`);
            if (!input.value.trim()) return;

            fetch('/api/comments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ post_id: postId, content: input.value.trim() })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') { loadComments(postId); input.value = ''; }
            });
        }

        function deleteComment(commentId, postId) {
            fetch(`/api/comments/${commentId}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => { if (data.status === 'success') loadComments(postId); });
        }

        function focusComment(postId) { document.getElementById(`commentInput-${postId}`).focus(); }

        function openCreatePostModal() {
            if (!currentUser) { alert('로그인이 필요합니다.'); openAuthModal(); return; }
            document.getElementById('createPostModal').classList.remove('hidden');
        }
        function closeCreatePostModal() { document.getElementById('createPostModal').classList.add('hidden'); }

        async function submitNewPost() {
            const title = document.getElementById('postTitleInput').value.trim();
            const content = document.getElementById('postContentInput').value.trim();
            const fileInput = document.getElementById('postFileInput');
            let imageUrl = '';

            if (!title || !content) { alert('제목과 내용을 입력해 주세요.'); return; }

            if (fileInput.files.length > 0) {
                const formData = new FormData();
                formData.append('file', fileInput.files[0]);
                const uploadRes = await fetch('/api/upload', { method: 'POST', body: formData });
                const uploadData = await uploadRes.json();
                if (uploadData.status === 'success') { imageUrl = uploadData.image_url; }
                else { alert('사진 업로드 실패: ' + uploadData.message); return; }
            }

            fetch('/api/posts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: title, image_url: imageUrl, content: content })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    closeCreatePostModal();
                    document.getElementById('postTitleInput').value = '';
                    document.getElementById('postFileInput').value = '';
                    document.getElementById('postContentInput').value = '';
                    loadPosts();
                }
            });
        }

        function openCreateStoryModal() {
            if (!currentUser) { alert('로그인이 필요합니다.'); openAuthModal(); return; }
            document.getElementById('createStoryModal').classList.remove('hidden');
        }
        function closeCreateStoryModal() { document.getElementById('createStoryModal').classList.add('hidden'); }

        async function submitNewStory() {
            const title = document.getElementById('storyTitleInput').value.trim();
            const desc = document.getElementById('storyDescInput').value.trim();
            const fileInput = document.getElementById('storyFileInput');
            let imageUrl = '';

            if (!title) { alert('스토리 제목을 입력해 주세요.'); return; }

            if (fileInput.files.length > 0) {
                const formData = new FormData();
                formData.append('file', fileInput.files[0]);
                const uploadRes = await fetch('/api/upload', { method: 'POST', body: formData });
                const uploadData = await uploadRes.json();
                if (uploadData.status === 'success') { imageUrl = uploadData.image_url; }
            }

            fetch('/api/stories', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: title, desc: desc, image_url: imageUrl })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    closeCreateStoryModal();
                    document.getElementById('storyTitleInput').value = '';
                    document.getElementById('storyFileInput').value = '';
                    document.getElementById('storyDescInput').value = '';
                    loadStories();
                }
            });
        }

        function showStoryModal(el, storyId, username, title, desc, imageUrl, createdAt) {
            if (currentUser) {
                fetch(`/api/stories/${storyId}/view`, { method: 'POST' });
            }

            const ring = el.querySelector('.story-ring');
            if (ring) { ring.classList.remove('story-ring'); ring.classList.add('story-viewed'); }

            const userElem = document.getElementById('storyUser');
            userElem.innerText = username;
            userElem.onclick = () => window.location.href = `/profile/${username}`;

            document.getElementById('storyTimeAgo').innerText = timeAgo(createdAt);
            document.getElementById('storyTitle').innerText = title;
            document.getElementById('storyDesc').innerText = desc;
            
            const bg = document.getElementById('storyBg');
            if (imageUrl) {
                bg.style.backgroundImage = `url('${imageUrl}')`;
            } else {
                bg.style.backgroundImage = 'none';
                bg.className = "absolute inset-0 flex flex-col items-center justify-center text-white p-8 text-center bg-gradient-to-br from-pink-500 to-rose-600";
            }

            const modal = document.getElementById('storyModal');
            const progress = document.getElementById('storyProgress');
            modal.classList.remove('hidden');
            progress.classList.remove('animate-progress');
            void progress.offsetWidth;
            progress.classList.add('animate-progress');

            clearTimeout(storyTimer);
            storyTimer = setTimeout(() => closeStoryModal(), 5000);
        }

        function closeStoryModal() {
            document.getElementById('storyModal').classList.add('hidden');
            clearTimeout(storyTimer);
        }

        function openAuthModal() { document.getElementById('authModal').classList.remove('hidden'); }
        function closeAuthModal() { document.getElementById('authModal').classList.add('hidden'); }

        function toggleAuthMode() {
            isSignupView = !isSignupView;
            document.getElementById('loginFormArea').classList.toggle('hidden', isSignupView);
            document.getElementById('signupFormArea').classList.toggle('hidden', !isSignupView);
            document.getElementById('authModalSubtitle').innerText = isSignupView ? '친구들의 사진과 동영상을 보려면 가입하세요.' : 'Woongstagram에 로그인하세요.';
            document.getElementById('authToggleText').innerText = isSignupView ? '계정이 있으신가요?' : '계정이 없으신가요?';
            document.getElementById('authToggleBtn').innerText = isSignupView ? '로그인' : '가입하기';
        }

        function handleSignupSubmit() {
            const username = document.getElementById('signupUsername').value.trim();
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value.trim();

            fetch('/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, name, email, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') { closeAuthModal(); checkLoginStatus(); loadPosts(); loadStories(); loadRecommendations(); }
                else alert(data.message);
            });
        }

        function handleLoginSubmit() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') { closeAuthModal(); checkLoginStatus(); loadPosts(); loadStories(); loadRecommendations(); }
                else alert(data.message);
            });
        }

        function togglePasswordVisibility(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-regular fa-eye-slash absolute right-3 top-3 text-slate-400 cursor-pointer';
            } else {
                input.type = 'password';
                icon.className = 'fa-regular fa-eye absolute right-3 top-3 text-slate-400 cursor-pointer';
            }
        }

        function escapeHtml(text) { return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }
    </script>
</body>
</html>
